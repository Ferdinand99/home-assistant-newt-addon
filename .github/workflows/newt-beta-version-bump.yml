name: Bump Pangolin CLI version (beta)

# Watches fosrl/cli (the Pangolin CLI, which embeds Newt) for new releases and
# opens a PR bumping PANGOLIN_CLI_VERSION and the pinned SHA256 checksums in
# newt-beta/ only. The stable channel (newt/) still ships the standalone Newt
# binary and is NOT promoted from this: newt-stable-promote.yml is gated off
# while beta runs the CLI.

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-cli-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get Pangolin CLI version currently pinned in newt-beta
        id: current
        run: |
          CURRENT=$(grep -oP '^ARG PANGOLIN_CLI_VERSION=\K.*' newt-beta/Dockerfile)
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Get latest fosrl/cli release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL --fail \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/fosrl/cli/releases/latest" \
            -o /tmp/release.json
          TAG=$(jq -r '.tag_name' /tmp/release.json)
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if an update is needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.latest.outputs.version }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract SHA256 checksums for our architectures
        if: steps.check.outputs.needed == 'true'
        id: sha
        run: |
          for pair in "amd64:amd64" "arm64:arm64" "arm32:arm32" "arm32v6:arm32v6"; do
            asset="${pair%%:*}"
            key="${pair##*:}"
            digest=$(jq -r --arg name "pangolin-cli_linux_${asset}" \
              '.assets[] | select(.name == $name) | .digest' /tmp/release.json)
            if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
              echo "::error::No digest found for pangolin-cli_linux_${asset} in release ${{ steps.latest.outputs.version }}"
              exit 1
            fi
            echo "${key}=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          done

      - name: Update newt-beta/Dockerfile
        if: steps.check.outputs.needed == 'true'
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          sed -i "s/^ARG PANGOLIN_CLI_VERSION=.*/ARG PANGOLIN_CLI_VERSION=${NEW}/" newt-beta/Dockerfile
          sed -i "s/^ARG PANGOLIN_CLI_SHA256_AMD64=.*/ARG PANGOLIN_CLI_SHA256_AMD64=\"${{ steps.sha.outputs.amd64 }}\"/" newt-beta/Dockerfile
          sed -i "s/^ARG PANGOLIN_CLI_SHA256_ARM64=.*/ARG PANGOLIN_CLI_SHA256_ARM64=\"${{ steps.sha.outputs.arm64 }}\"/" newt-beta/Dockerfile
          sed -i "s/^ARG PANGOLIN_CLI_SHA256_ARM32=.*/ARG PANGOLIN_CLI_SHA256_ARM32=\"${{ steps.sha.outputs.arm32 }}\"/" newt-beta/Dockerfile
          sed -i "s/^ARG PANGOLIN_CLI_SHA256_ARM32V6=.*/ARG PANGOLIN_CLI_SHA256_ARM32V6=\"${{ steps.sha.outputs.arm32v6 }}\"/" newt-beta/Dockerfile

      - name: Bump newt-beta/config.yaml version
        if: steps.check.outputs.needed == 'true'
        id: configversion
        run: |
          # The add-on version is independent of the CLI version (the CLI's 0.x
          # numbers are lower than the old Newt-based 1.x ones, so Home Assistant
          # would not offer the update). Increment the beta counter instead.
          CURRENT_CONFIG_VERSION=$(grep -oP '^version: "\K[^"]+' newt-beta/config.yaml)
          if [[ ! "${CURRENT_CONFIG_VERSION}" =~ ^(.+-beta)([0-9]+)$ ]]; then
            echo "::error::Cannot parse beta version '${CURRENT_CONFIG_VERSION}' in newt-beta/config.yaml"
            exit 1
          fi
          NEW_CONFIG_VERSION="${BASH_REMATCH[1]}$(( BASH_REMATCH[2] + 1 ))"
          sed -i "s/^version: \".*\"/version: \"${NEW_CONFIG_VERSION}\"/" newt-beta/config.yaml
          echo "version=${NEW_CONFIG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Add CHANGELOG.md entry
        if: steps.check.outputs.needed == 'true'
        run: |
          DATE=$(date +"%d.%m.%Y")
          cat > /tmp/entry.txt <<EOF
          ## 🔹 Version ${{ steps.configversion.outputs.version }} - (${DATE})
          - Bumped Pangolin CLI to ${{ steps.latest.outputs.version }}

          EOF
          sed -i '2r /tmp/entry.txt' newt-beta/CHANGELOG.md

      - name: Open pull request
        if: steps.check.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/pangolin-cli-${{ steps.latest.outputs.version }}
          title: "Bump Pangolin CLI to ${{ steps.latest.outputs.version }} (beta)"
          commit-message: "Bump Pangolin CLI to ${{ steps.latest.outputs.version }} in newt-beta"
          labels: newt-beta, dependencies
          assignees: Ferdinand99
          body: |
            Automated bump of the Pangolin CLI binary pinned in `newt-beta/`.

            - Release: https://github.com/fosrl/cli/releases/tag/${{ steps.latest.outputs.version }}
            - SHA256 checksums were fetched from GitHub's release asset digests for this tag
            - Only `newt-beta/` is touched by this workflow — `newt/` (stable) is promoted
              manually once this has been observed running on beta

            Please review the checksums and the changelog wording before merging.
