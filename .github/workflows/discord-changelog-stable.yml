name: Post Stable Changelog to Discord

on:
  push:
    branches:
      - main
    paths:
      - "newt/CHANGELOG.md"

jobs:
  post_stable_changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract latest changelog block
        id: changelog
        shell: bash
        run: |
          # Extract the latest version block from the stable changelog
          changelog_block=$(awk '
            BEGIN { found=0 }
            /^## 🔹 Version / {
              if (found) exit;
              found=1;
              print $0;
              next;
            }
            found {
              if (/^## /) exit;
              print $0;
            }
          ' newt/CHANGELOG.md)

          # Multi-line step output. The next step builds the JSON with jq from an
          # environment variable, so the changelog text never becomes shell code
          # (backticks or $(...) in a changelog entry would otherwise run).
          {
            echo 'BLOCK<<CHANGELOG_EOF'
            echo "$changelog_block"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          ROLE_ID: "1374737922980581436"
          BLOCK: ${{ steps.changelog.outputs.BLOCK }}
        shell: bash
        run: |
          # The message is sent outside the embed itself to trigger the ping
          MSG_CONTENT="<@&$ROLE_ID> A new Stable update of Newt is ready! 🚀"

          jq -n \
            --arg content "$MSG_CONTENT" \
            --arg description "$BLOCK" \
            '{username: "Newt Changelog Bot", content: $content,
              embeds: [{title: "📦 Stable Changelog Update", description: $description, color: 3066993}]}' \
            | curl --fail-with-body -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK"
