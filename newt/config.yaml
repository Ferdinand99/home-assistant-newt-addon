name: "Newt Add-on"
version: "1.16.0-stable2"
slug: "newt"
description: "Newt client for Home Assistant with Pangolin connectivity"
url: "https://github.com/Ferdinand99/home-assistant-newt-addon"
icon: "icon.png"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
startup: services
boot: auto
host_network: true
apparmor: false
privileged:
  - NET_ADMIN
  - NET_RAW
options:
  PANGOLIN_ENDPOINT: "https://example.com"
  NEWT_ID: "your_newt_id"
  NEWT_SECRET: "your_newt_secret"
  custom_env_vars: []
schema:
  PANGOLIN_ENDPOINT: "str"
  NEWT_ID: "str"
  NEWT_SECRET: "str"
  custom_env_vars:
    - "match(^[A-Z_][A-Z0-9_]*=.+$)"
hassio_api: false
homeassistant_api: false
auth_api: false
hassio_role: "default"
